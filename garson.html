<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@360;480;560&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/kasa.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23100e0c' width='32' height='32'/%3E%3Ctext y='23' x='6' fill='%23e08a4f' font-size='18' font-family='Georgia'%3EG%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <a href="index.html">Restoran</a>
        <span>Garson</span>
      </div>
      <nav class="screens" aria-label="Ekranlar">
        <a href="garson.html" aria-current="page">Garson</a>
        <a href="kasa.html">Kasa</a>
        <a href="mutfak.html">Mutfak</a>
      </nav>
      <p class="clock" id="clock"></p>
      <p class="stat" id="ready-stat">
        <span>Servis</span>
        <strong id="ready-count">0</strong>
        <em>hazır</em>
      </p>
    </header>

    <div class="layout">
      <aside class="tables" aria-label="Masalar">
        <p class="label">Masalar</p>
        <div class="table-grid" id="tables"></div>
      </aside>

      <section class="menu-pane">
        <div class="cats" id="cats" role="tablist" aria-label="Kategoriler"></div>
        <div class="products" id="products"></div>
      </section>

      <aside class="ticket" aria-label="Sipariş">
        <div class="ticket-head">
          <div>
            <p class="label">Sipariş</p>
            <h2 id="table-title">Masa 1</h2>
          </div>
          <button class="text-btn" type="button" id="clear-draft">Taslağı sil</button>
        </div>
        <p class="label section-label">Yeni tur</p>
        <ul class="lines" id="draft-lines"></ul>
        <p class="label section-label">Gönderilen</p>
        <ul class="lines sent-lines" id="sent-lines"></ul>
        <p class="hint" id="ready-note" hidden></p>
        <div class="totals">
          <div><span>Bu tur</span><span id="draft-total">₺0</span></div>
          <div><span>Açık adisyon</span><strong id="bill-total">₺0</strong></div>
        </div>
        <button class="pay-btn" type="button" id="send" disabled>Mutfağa ve kasaya gönder</button>
      </aside>
    </div>

    <script src="js/menu.js"></script>
    <script src="js/store.js"></script>
    <script src="js/garson.js"></script>
  </body>
</html>
